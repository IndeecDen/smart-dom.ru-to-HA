<!doctype html>
<meta charset="utf-8">
<title>Дом.ру — проверка карточек</title>
<style>
  body { background: #fafafa; color: #212121; font: 16px sans-serif; margin: 24px; }
  #cards { width: 360px; }
  ha-card { display: block; border: 1px solid #ccc; margin-bottom: 20px; }
</style>
<h1>Проверка собранных карточек</h1>
<pre id="result">Running…</pre>
<div id="cards"></div>
<script type="module">
  import "../../custom_components/my_dom_ru/www/mdr-intercom-call-card.js";
  import "../../custom_components/my_dom_ru/www/mdr-intercom-mic-card.js";
  const checks = [];
  const check = (label, condition) => {
    checks.push({ label, passed: Boolean(condition) });
    if (!condition) throw new Error(label);
  };
  // Local fixture only: service calls never leave this page.
  const calls = [];
  const hass = {
    language: "ru",
    states: { "sensor.call": { state: "ringing", attributes: {} } },
    callService: async (...args) => calls.push(args),
    callWS: async ({ entity_id }) => ({
      entity_id, page: 0, last: true, source_name: "Тестовый адрес",
      events: [{ event_id: "test-key", event_type: "key_activated",
        occurred_at: 1770033600, key_name: "Тестовый ключ" }],
    }),
  };
  const flush = async () => {
    await new Promise(resolve => setTimeout(resolve, 50));
  };
  try {
    for (const type of ["mdr-intercom-call-card", "mdr-event-history-card", "mdr-intercom-mic-card"]) {
      const entries = window.customCards.filter(card => card.type === type);
      check(`${type} is available once in the card picker`,
        entries.length === 1 && entries[0].name.startsWith("Умный Дом.ру") && customElements.get(type));
    }
    const fixtureHass = { ...hass, entities: {
      "sensor.call": { entity_id: "sensor.call", platform: "my_dom_ru", translation_key: "call_state", device_id: "door" },
      "lock.test": { entity_id: "lock.test", platform: "my_dom_ru", device_id: "door" },
      "event.real": { entity_id: "event.real", platform: "my_dom_ru", translation_key: "account_history", device_id: "place" },
    }, states: { ...hass.states, "lock.test": { state: "locked", attributes: {} }, "event.real": { state: "unknown", attributes: {} } } };
    const CallCard = customElements.get("mdr-intercom-call-card");
    const HistoryCard = customElements.get("mdr-event-history-card");
    check("New call card selects real sensor and matching lock", CallCard.getStubConfig(fixtureHass).doorbells[0].lock === "lock.test");
    check("New history card selects real history entity", HistoryCard.getStubConfig(fixtureHass).entities[0] === "event.real");
    // Native HA form is represented by a test double on this standalone page.
    let nativeEditorLoaded = false;
    window.loadCardHelpers = async () => ({ createCardElement: () => {
      customElements.define("hui-entities-card", class extends HTMLElement {
        static async getConfigElement() {
          nativeEditorLoaded = true;
          customElements.define("ha-form", class extends HTMLElement {});
        }
      });
      return document.createElement("hui-entities-card");
    } });
    const editor = await CallCard.getConfigElement();
    editor.hass = fixtureHass;
    editor.setConfig({ type: "custom:mdr-intercom-call-card", call_state: "sensor.call", lock: "lock.test", mic: false });
    document.querySelector("#cards").append(editor);
    await flush();
    check("Visual editor loads native form lazily", nativeEditorLoaded && editor.shadowRoot.querySelectorAll("ha-form").length === 2);
    let edited;
    editor.addEventListener("config-changed", event => { edited = event.detail.config; });
    editor.shadowRoot.querySelector("ha-form").dispatchEvent(new CustomEvent("value-changed", {
      detail: { value: { call_state: "sensor.other", lock: "lock.test" } }, bubbles: true, composed: true,
    }));
    check("Changing doorbell clears old lock and preserves other options", edited.doorbells[0].call_state === "sensor.other" && !edited.doorbells[0].lock && edited.mic === false && edited.type === "custom:mdr-intercom-call-card");
    editor.remove();
    const historyEditor = await HistoryCard.getConfigElement();
    historyEditor.hass = fixtureHass;
    historyEditor.setConfig({ type: "custom:mdr-event-history-card", entity: "event.real", title: "Мой дом" });
    document.querySelector("#cards").append(historyEditor);
    await flush();
    let editedHistory;
    historyEditor.addEventListener("config-changed", event => { editedHistory = event.detail.config; });
    const historyForm = historyEditor.shadowRoot.querySelector("ha-form");
    historyForm.dispatchEvent(new CustomEvent("value-changed", {
      detail: { value: { entities: ["event.new"] } }, bubbles: true, composed: true,
    }));
    check("History visual editor migrates entity and preserves title", editedHistory.entities[0] === "event.new" && !editedHistory.entity && editedHistory.title === "Мой дом");
    historyEditor.remove();
    const emptyCall = document.createElement("mdr-intercom-call-card");
    emptyCall.setConfig(CallCard.getStubConfig());
    document.querySelector("#cards").append(emptyCall);
    await flush();
    check("Empty call card gives setup guidance instead of configuration error", emptyCall.shadowRoot.textContent.includes("Выберите сенсор"));
    emptyCall.remove();
    const emptyHistory = document.createElement("mdr-event-history-card");
    let historyRequests = 0;
    emptyHistory.hass = { ...hass, callWS: async () => { historyRequests++; throw Error("fixture unavailable"); } };
    emptyHistory.setConfig(HistoryCard.getStubConfig());
    document.querySelector("#cards").append(emptyHistory);
    await flush();
    check("Empty history card requests no invented entity", historyRequests === 0 && emptyHistory.shadowRoot.textContent.includes("Выберите источник"));
    emptyHistory.setConfig({ entity: "event.real" });
    await flush();
    check("Failed history renders one error and one retry", emptyHistory.shadowRoot.querySelectorAll('[role="alert"]').length === 1 && !emptyHistory.shadowRoot.querySelector(".more"));
    emptyHistory.remove();
    const call = document.createElement("mdr-intercom-call-card");
    call.setConfig({ call_state: "sensor.call", lock: "lock.test", open_action: "slide", mic: false });
    call.hass = hass;
    document.querySelector("#cards").append(call);
    await flush();
    const control = call.shadowRoot.querySelector("mdr-open-control");
    const track = control.shadowRoot.querySelector(".track");
    for (const width of [360, 1000]) {
      document.querySelector("#cards").style.width = `${width}px`;
      await flush();
      const rect = track.getBoundingClientRect();
      check(`Track visible at ${width}px`, rect.width > 200 && rect.height >= 80);
    }
    document.querySelector("#cards").style.width = "360px";
    await flush();
    const knob = control.shadowRoot.querySelector(".knob");
    knob.setPointerCapture = () => {}; // Synthetic pointer, no OS capture.
    const rect = track.getBoundingClientRect();
    const pointer = (type, x) => knob.dispatchEvent(new PointerEvent(type, {
      bubbles: true, pointerId: 1, button: 0, clientX: x,
    }));
    pointer("pointerdown", rect.left + 34);
    pointer("pointermove", rect.right);
    pointer("pointercancel", rect.right);
    pointer("pointerup", rect.right);
    check("Cancelled slide sends no unlock", calls.length === 0);
    pointer("pointerdown", rect.left + 34);
    pointer("pointermove", rect.right);
    pointer("pointerup", rect.right);
    await flush();
    check("Completed slide sends one unlock", calls.length === 1 && calls[0][1] === "unlock");
    const history = document.createElement("mdr-event-history-card");
    history.setConfig({ entity: "event.test" });
    history.hass = hass;
    document.querySelector("#cards").append(history);
    await flush();
    const text = history.shadowRoot.textContent;
    check("Key opening is rendered", text.includes("Домофон: открыт ключом"));
    check("Cloud key name is rendered", text.includes("Тестовый ключ"));
  } catch (error) {
    checks.push({ error: String(error), passed: false });
  }
  window.smokeResults = checks;
  document.querySelector("#result").textContent = JSON.stringify(checks, null, 2);
</script>
