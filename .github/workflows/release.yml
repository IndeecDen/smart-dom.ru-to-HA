name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements_test.txt
      - run: python -m pytest tests/unit tests/ha tests/portable -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: python tools/copy_licenses.py
      - run: python tools/package.py
      - name: Verify manifest version matches tag
        run: |
          version=$(python -c "import json;print(json.load(open('custom_components/my_dom_ru/manifest.json'))['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "manifest $version != tag $tag"
            exit 1
          fi
          # Persist for the next step: each `run` block is a fresh shell, so a
          # variable set here is otherwise lost and the manual archive name
          # collapses to `my_dom_ru--manual.zip`.
          echo "tag=${tag}" >> "$GITHUB_ENV"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/my_dom_ru.zip \
            "dist/my_dom_ru-${tag}-manual.zip" \
            dist/SHA256SUMS.txt \
            --clobber
