name: Integration checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements_test.txt
      - run: python -m pytest tests/unit tests/ha tests/portable -q
      - run: python -m compileall -q custom_components/my_dom_ru
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: python tools/copy_licenses.py
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: my-dom-ru
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
