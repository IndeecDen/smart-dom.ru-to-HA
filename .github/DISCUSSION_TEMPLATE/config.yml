# Обсуждения

Здесь обсуждаются вопросы по настройке, архитектура и идеи развития. Отчёты об
ошибках — в [issues](https://github.com/IndeecDen/smart-dom.ru-to-HA/issues).

Прежде чем задавать вопрос, проверьте [docs/FEATURES.md](docs/FEATURES.md):
часть функций приложения сознательно не реализована.

Не публикуйте пароли, коды из SMS, токены, ссылки временных пропусков, коды
электронных ключей, HAR-записи, APK, экспорт `.storage` и данные гостей.
